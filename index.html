<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海心智惠 · 全病程管理业务介绍</title>
<style>
:root{
  --blue:#2F5BE8;--blue-d:#183B8C;--blue-l:#E9F0FF;--blue-m:#6E8FF5;
  --green:#12B76A;--green-l:#E4F8EE;--violet:#6E56CF;--cyan:#0EA5B7;
  --ink:#1B2A4A;--ink2:#60708F;--ink3:#93A2BF;--line:#DDE6F5;
  --card:#fff;--bg:#F4F8FF;--amber:#F5A524;--amber-l:#FFF5E3;
  --shadow:0 8px 28px rgba(29,62,140,.08);--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Heiti SC",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color:var(--ink);background:var(--bg);overflow:hidden;display:grid;grid-template-rows:64px 1fr}
/* ---------- 顶栏 ---------- */
.top{display:flex;align-items:center;gap:18px;padding:0 26px;max-width:100vw;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:30;box-shadow:0 2px 14px rgba(29,62,140,.05)}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand .mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--cyan));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.brand b{font-size:15px;letter-spacing:.2px}
.nav{display:flex;gap:4px;flex:1;min-width:0;justify-content:center;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex-shrink:0;border:0;background:transparent;color:var(--ink2);cursor:pointer;
  padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:.2s;font-family:inherit}
.nav button:hover{background:#F0F5FF;color:var(--blue)}
.nav button.on{background:var(--blue);color:#fff;box-shadow:0 5px 14px rgba(47,91,232,.25)}
.top-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hint{font-size:11.5px;color:var(--ink3);white-space:nowrap}
/* ---------- 导出按钮 ---------- */
.export-btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--green);
  background:var(--green-l);color:#0A6E42;padding:8px 14px;border-radius:10px;cursor:pointer;
  font-size:12.8px;font-weight:700;transition:.2s;font-family:inherit;white-space:nowrap}
.export-btn:hover{background:var(--green);color:#fff;box-shadow:0 6px 16px rgba(18,183,106,.28)}
.export-btn svg{width:15px;height:15px;flex-shrink:0}
/* ---------- 内容区 ---------- */
main{position:relative;overflow:hidden}
.mod{position:absolute;inset:0;overflow-y:auto;padding:32px clamp(20px,5vw,72px) 110px;display:none}
.mod.on{display:block}
.wrap{max-width:1180px;margin:0 auto}
.mhead{margin-bottom:26px}
.mhead .kick{display:inline-block;font-size:11px;font-weight:800;letter-spacing:2px;color:var(--blue);
  background:var(--blue-l);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.mhead h1{font-size:clamp(26px,3.4vw,38px);line-height:1.25;letter-spacing:-.5px;margin-bottom:9px}
.mhead p{font-size:14px;color:var(--ink2);line-height:1.8;max-width:880px}
/* 通用块 */
.sec{margin:30px 0 0}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.sec-h .no{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:1px}
.sec-h h2{font-size:19px;letter-spacing:-.2px}
.sec-h small{font-size:12px;color:var(--ink3)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:20px 21px;box-shadow:var(--shadow)}
.card h3{font-size:15.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card p{font-size:13px;color:var(--ink2);line-height:1.75}
.num{width:26px;height:26px;border-radius:8px;background:var(--blue-l);color:var(--blue);
  display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.card.green .num{background:var(--green-l);color:var(--green)}
.card.violet .num{background:#F1EDFF;color:var(--violet)}
.bullets{list-style:none;display:grid;gap:7px;margin-top:10px}
.bullets li{position:relative;padding-left:15px;font-size:12.8px;color:var(--ink2);line-height:1.65}
.bullets li::before{content:'';position:absolute;left:1px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--blue-m)}
.tint{border-left:3px solid var(--blue);background:var(--blue-l);padding:12px 15px;border-radius:0 10px 10px 0;
  font-size:12.8px;line-height:1.75;color:var(--blue-d);margin-top:14px}
.tint.g{border-color:var(--green);background:var(--green-l);color:#0A6E42}
.tint.a{border-color:var(--amber);background:var(--amber-l);color:#8A5A00}
/* 场景 chip */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--ink2)}
.chip b{color:var(--blue)}
/* 角色协同：关系可视化 */
.collab{position:relative;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(135deg,#F8FBFF 0%,#EDF4FF 55%,#F3FBF7 100%);
  padding:24px 26px 18px;box-shadow:var(--shadow);overflow:hidden}
.collab-row{display:grid;grid-template-columns:1fr 148px 1.12fr 148px 1fr;align-items:center;gap:8px}
.cnode{position:relative;z-index:2;background:#fff;border:1px solid var(--line);border-radius:15px;
  padding:15px 16px;min-height:140px;box-shadow:0 8px 20px rgba(29,62,140,.09)}
.cnode.mid{transform:translateY(-9px);border-color:rgba(47,91,232,.35);box-shadow:0 14px 32px rgba(47,91,232,.18)}
.cnode .ci{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-bottom:9px}
.cnode.a .ci{background:var(--blue-l);color:var(--blue)}
.cnode.b .ci{background:var(--green-l);color:var(--green)}
.cnode.c .ci{background:#F1EDFF;color:var(--violet)}
.cnode h3{font-size:15px;margin-bottom:3px}
.cnode .sub{font-size:11px;color:var(--ink3);margin-bottom:8px}
.cnode p{font-size:12.2px;color:var(--ink2);line-height:1.65}
.cnode .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.cnode .tags span{font-size:10.5px;background:#F4F7FD;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--ink2)}
.clink{position:relative;height:78px;display:grid;place-items:center}
.clink::before{content:'';position:absolute;left:6px;right:6px;top:50%;height:4px;border-radius:4px;
  transform:translateY(-50%);background:linear-gradient(90deg,var(--blue),var(--blue-m))}
.clink.r::before{background:linear-gradient(90deg,var(--green),var(--cyan))}
.clink::after{content:'';position:absolute;right:0;top:50%;border-left:9px solid var(--blue-m);
  border-top:6px solid transparent;border-bottom:6px solid transparent;transform:translateY(-50%)}
.clink.r::after{border-left-color:var(--cyan)}
.clink.r .rev{border-right-color:var(--green)}
.clink .rev{position:absolute;left:0;top:50%;border-right:9px solid var(--blue);
  border-top:6px solid transparent;border-bottom:6px solid transparent;transform:translateY(-50%)}
.clink .lb{position:relative;z-index:3;background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:5px 8px;font-size:10.8px;font-weight:700;color:var(--blue-d);white-space:nowrap;box-shadow:0 3px 10px rgba(29,62,140,.1)}
.clink.r .lb{color:#0A6E42}
/* 双向标签：上行=向右（下游），下行=向左（回溯） */
.clink .lb2{position:relative;z-index:3;display:flex;flex-direction:column;gap:1px;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:5px 8px;white-space:nowrap;
  box-shadow:0 3px 10px rgba(29,62,140,.1);font-size:10.6px;font-weight:700;line-height:1.5}
.clink .lb2 b{font-weight:700;color:var(--blue-d)}
.clink .lb2 .bk{font-weight:600;color:var(--ink3)}
.clink.r .lb2 b{color:#0A6E42}
.clink .dot.bk{background:var(--violet);box-shadow:0 0 0 4px rgba(124,92,255,.14);animation:flowDotBack 2.9s linear infinite}
.clink.r .dot.bk{background:var(--cyan);box-shadow:0 0 0 4px rgba(18,183,106,.14)}
@keyframes flowDotBack{0%{left:calc(100% - 14px);opacity:0}12%{opacity:1}88%{opacity:1}100%{left:6px;opacity:0}}
.clink .dot{position:absolute;z-index:2;top:50%;left:6px;width:8px;height:8px;border-radius:50%;
  transform:translateY(-50%);background:var(--blue);box-shadow:0 0 0 4px rgba(47,91,232,.15);
  animation:flowDot 2.4s linear infinite}
.clink.r .dot{background:var(--green);box-shadow:0 0 0 4px rgba(18,183,106,.15);animation-delay:-1.1s}
@keyframes flowDot{0%{left:6px;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:calc(100% - 14px);opacity:0}}
.loopback{position:relative;height:44px;margin:12px 26px 0;display:grid;place-items:center}
.loopback::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--blue-m);transform:translateY(-50%)}
.loopback::after{content:'';position:absolute;left:0;top:50%;border-right:9px solid var(--blue-m);
  border-top:6px solid transparent;border-bottom:6px solid transparent;transform:translateY(-50%)}
.loopback span{position:relative;z-index:2;background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;font-size:11.2px;font-weight:700;color:var(--blue-d);white-space:nowrap}
.loopback .dot{position:absolute;z-index:2;top:50%;right:6px;width:7px;height:7px;border-radius:50%;
  background:var(--violet);transform:translateY(-50%);animation:flowBack 3.2s linear infinite}
@keyframes flowBack{0%{right:6px;opacity:0}10%{opacity:1}90%{opacity:1}100%{right:calc(100% - 12px);opacity:0}}
.shared-core{position:relative;z-index:2;margin:10px auto 0;width:max-content;max-width:100%;
  background:linear-gradient(120deg,var(--blue),var(--cyan));color:#fff;border-radius:999px;
  padding:7px 18px;font-size:11.5px;box-shadow:0 8px 18px rgba(47,91,232,.22)}
.shared-core b{font-weight:800}
/* 业务全流程 */
.journey{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;margin-top:8px}
.journey::before{content:'';position:absolute;left:5%;right:5%;top:26px;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--blue),var(--green),var(--violet));z-index:0}
.jstep{position:relative;z-index:1;background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:14px 11px 13px;text-align:center;box-shadow:var(--shadow)}
.jstep .jn{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;
  margin:0 auto 10px;font-size:12px;font-weight:800;box-shadow:0 0 0 5px #fff}
.jstep:nth-child(2) .jn{background:#4A72F0}.jstep:nth-child(3) .jn{background:#5C7CFF}
.jstep:nth-child(4) .jn{background:var(--cyan)}.jstep:nth-child(5) .jn{background:var(--green)}
.jstep:nth-child(6) .jn{background:#0E9E86}.jstep:nth-child(7) .jn{background:var(--violet)}
.jstep b{display:block;font-size:12.6px;line-height:1.45;margin-bottom:6px}
.jstep span{display:block;font-size:11px;color:var(--ink2);line-height:1.55}
.jstep::after{content:'›';position:absolute;right:-9px;top:22px;color:var(--blue-m);font-size:22px;font-weight:800;z-index:2}
.jstep:last-child::after{display:none}
/* 流程 */
.flow{display:grid;gap:0;margin-top:6px}
.frow{display:grid;grid-template-columns:190px 1fr;gap:18px;padding:18px 0;border-bottom:1px dashed var(--line)}
.frow:last-child{border-bottom:0}
.frow .ft{display:flex;gap:10px;align-items:flex-start}
.frow .ft b{font-size:14.5px;line-height:1.5}
.steps{display:grid;gap:9px}
.step{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px}
.step .n{width:22px;height:22px;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center;
  font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px}
.step.g .n{background:var(--green)}.step.v .n{background:var(--violet)}
.step b{font-size:13.2px;display:block;margin-bottom:3px}
.step span{font-size:12.3px;color:var(--ink2);line-height:1.65}
/* 配图画廊 */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:6px}
.shot{border:1px solid var(--line);border-radius:13px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}
.shot-frame{height:220px;background:linear-gradient(180deg,#EDF3FF,#F8FBFF);display:grid;place-items:center;padding:12px;overflow:hidden}
.shot-frame img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 4px 16px rgba(29,62,140,.13)}
.shot figcaption{padding:10px 12px;font-size:12.2px;color:var(--ink2);border-top:1px solid var(--line);line-height:1.5}
.shot figcaption b{color:var(--ink);display:block;font-size:12.8px;margin-bottom:2px}
/* 三端中枢 */
.hub{display:grid;grid-template-columns:1fr 54px 1.05fr 54px 1fr;align-items:center;gap:10px;margin:6px 0 4px}
.hub .end{border:1px solid var(--line);border-radius:14px;background:#fff;padding:17px;text-align:center;box-shadow:var(--shadow)}
.hub .end .em{width:40px;height:40px;border-radius:12px;background:var(--blue-l);color:var(--blue);
  display:grid;place-items:center;margin:0 auto 9px}
.hub .end.g .em{background:var(--green-l);color:var(--green)}
.hub .end.v .em{background:#F1EDFF;color:var(--violet)}
.hub .end b{display:block;font-size:14.5px;margin-bottom:3px}
.hub .end small{font-size:11.5px;color:var(--ink3)}
.hub .ct{text-align:center}
.hub .ct .c{width:78px;height:78px;border-radius:20px;background:linear-gradient(140deg,var(--blue),var(--cyan));
  color:#fff;display:grid;place-items:center;margin:0 auto 8px;font-size:12px;font-weight:800;line-height:1.35;
  box-shadow:0 10px 24px rgba(47,91,232,.3)}
.hub .ct span{font-size:11px;color:var(--ink3)}
.hub-arrow{text-align:center;color:var(--blue-m);font-size:20px;font-weight:700}
/* 功能表 */
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:13px;overflow:hidden;border:1px solid var(--line)}
.tbl th,.tbl td{padding:13px 15px;text-align:left;font-size:13px;border-bottom:1px solid var(--line);line-height:1.65;vertical-align:top}
.tbl th{background:#F5F8FF;font-size:12.2px;color:var(--ink2);font-weight:700;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td b{color:var(--ink)}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:7px;background:var(--blue-l);color:var(--blue);font-weight:700}
.tag.g{background:var(--green-l);color:var(--green)}.tag.v{background:#F1EDFF;color:var(--violet)}
/* 功能卡片 */
.func-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:6px}
.func-card{display:grid;grid-template-columns:176px minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:14px;
  border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow);padding:0 16px 16px;overflow:hidden}
.func-head{grid-column:1/-1;display:flex;align-items:center;gap:9px;padding:15px 2px 10px}
.func-head::before{content:'';width:4px;height:17px;border-radius:3px;background:linear-gradient(180deg,var(--blue),var(--cyan));flex-shrink:0}
.func-head h3{font-size:15.5px;line-height:1.35}
.func-head .tag{margin-left:auto;flex-shrink:0}
.func-shot{grid-column:1;grid-row:2;position:relative;border:0;padding:0;margin:0;min-height:220px;height:100%;
  background:linear-gradient(180deg,#EDF3FF,#F8FBFF);border-radius:11px;overflow:hidden;cursor:zoom-in;display:block;font-family:inherit}
.func-shot img{width:100%;height:100%;object-fit:contain;object-position:center;padding:10px;transition:transform .35s;display:block}
.func-shot.wide img{object-fit:cover;object-position:left top;padding:0}
.func-shot:hover img{transform:scale(1.035)}
.func-shot .zoom{position:absolute;right:8px;bottom:8px;background:rgba(10,25,55,.78);color:#fff;font-size:10.5px;
  font-weight:700;padding:4px 8px;border-radius:999px;backdrop-filter:blur(4px)}
.func-body{grid-column:2;grid-row:2;padding:2px 0;display:flex;flex-direction:column;gap:9px;min-width:0}
.func-desc{font-size:12.6px;line-height:1.75;color:var(--ink2)}
.func-points{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.func-points li{font-size:10.8px;background:#F4F7FD;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--ink2)}
/* 截图放大 */
.lightbox{position:fixed;inset:0;z-index:120;display:none;background:rgba(3,12,28,.86);backdrop-filter:blur(7px);padding:3vh 2vw}
.lightbox.show{display:grid;place-items:center}
.lb-panel{position:relative;width:96vw;height:92vh;max-width:1720px;background:#fff;border-radius:20px;overflow:hidden;
  display:grid;grid-template-columns:3fr 1fr;box-shadow:0 38px 110px rgba(0,0,0,.55);animation:lbIn .3s cubic-bezier(.2,.9,.3,1)}
@keyframes lbIn{from{opacity:0;transform:scale(.975)}to{opacity:1;transform:none}}
.lb-media{position:relative;display:grid;place-items:center;padding:26px 24px 38px;overflow:hidden;
  background:radial-gradient(circle at 50% 35%,#1E355B 0%,#0A1830 55%,#050D1E 100%)}
.lb-media img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.lb-cap{position:absolute;left:26px;bottom:16px;right:26px;color:rgba(255,255,255,.68);font-size:11.5px;line-height:1.5}
.lb-info{padding:34px 28px 26px;overflow-y:auto;display:flex;flex-direction:column;background:#fff}
.lb-kick{font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:var(--blue);background:var(--blue-l);
  padding:5px 10px;border-radius:999px;width:max-content;margin-bottom:13px}
.lb-info h2{font-size:clamp(20px,1.8vw,26px);line-height:1.35;margin-bottom:13px;padding-right:26px}
.lb-desc{font-size:13.5px;line-height:1.9;color:var(--ink2)}
.lb-info h4{font-size:11px;letter-spacing:1.2px;color:var(--ink3);margin:22px 0 10px;font-weight:800}
.lb-points{list-style:none;display:grid;gap:8px}
.lb-points li{position:relative;padding-left:16px;font-size:12.5px;line-height:1.65;color:var(--ink2)}
.lb-points li::before{content:'';position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.lb-close{position:absolute;top:14px;right:14px;z-index:5;width:36px;height:36px;border:0;border-radius:50%;
  background:rgba(255,255,255,.94);color:var(--ink);font-size:21px;line-height:1;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.16);transition:.2s}
.lb-close:hover{background:var(--blue);color:#fff}
.lb-nav{display:flex;gap:8px;margin-top:auto;padding-top:22px}
.lb-nav button{flex:1;border:1px solid var(--line);background:#F7FAFF;color:var(--blue-d);border-radius:9px;padding:9px 6px;
  font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
.lb-nav button:hover{background:var(--blue);border-color:var(--blue);color:#fff}
/* 项目构成 */
.proj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.proj .p{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.proj .ph{padding:17px 20px;background:linear-gradient(120deg,var(--blue),#5C7CFF);color:#fff}
.proj .p.g .ph{background:linear-gradient(120deg,var(--green),#3FC48D)}
.proj .ph b{font-size:17px;display:block}
.proj .ph span{font-size:11.5px;opacity:.85}
.proj .pb{padding:8px 20px 18px}
.prow{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px dashed var(--line)}
.prow:last-child{border-bottom:0}
.prow .pi{width:32px;height:32px;border-radius:9px;background:var(--blue-l);color:var(--blue);
  display:grid;place-items:center;flex-shrink:0;font-size:13px;font-weight:800}
.proj .p.g .prow .pi{background:var(--green-l);color:var(--green)}
.prow b{font-size:13.5px;display:block}
.prow small{font-size:11.5px;color:var(--ink3)}
/* 页脚 */
.pfoot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);line-height:1.8}
/* 打印 */
@page{size:A4;margin:14mm}
@media print{
  html,body{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important}
  .top,.export-btn,.pfoot{display:none!important}
  main{overflow:visible!important;height:auto!important}
  .mod{display:none!important;position:static!important;overflow:visible!important;padding:0!important}
  .mod.on{display:block!important}
  .wrap{max-width:none!important}
  .card,.cnode,.hub .end,.shot,.proj .p,.step,.jstep,.collab{box-shadow:none!important;break-inside:avoid}
  .sec,.frow,.tbl tr{break-inside:avoid}
  .shots{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .shot-frame{height:150px}
  .clink .dot,.loopback .dot{display:none!important}
  .collab-row{grid-template-columns:1fr 104px 1.06fr 104px 1fr!important}
  .clink .lb2{font-size:9.2px;padding:3px 5px;line-height:1.45}
  .journey{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  .journey::before{display:none!important}
  .lightbox{display:none!important}
  .func-card{box-shadow:none!important;break-inside:avoid}
  .func-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .func-shot{min-height:0;height:190px}
  .func-shot .zoom{display:none!important}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:980px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hint{display:none}.top{padding:0 14px;gap:10px}.brand b{display:none}
  .frow{grid-template-columns:1fr}.hub{grid-template-columns:1fr}.hub-arrow{transform:rotate(90deg)}
  .proj{grid-template-columns:1fr}
  .collab-row{grid-template-columns:1fr;gap:10px}
  .clink{height:30px}
  .clink::before,.clink::after,.clink .rev,.clink .dot{display:none}
  .clink .lb{font-size:11px}
  .clink .lb2{flex-direction:row;gap:8px;font-size:10.6px;padding:3px 9px}
  .loopback{margin:8px 0 0}
  .journey{grid-template-columns:repeat(2,minmax(0,1fr))}
  .journey::before{display:none}
  .jstep::after{display:none}
  .func-grid{grid-template-columns:1fr}
}
@media(max-width:680px){
  .func-card{grid-template-columns:1fr;grid-template-rows:auto auto auto;padding:0 14px 14px}
  .func-head{grid-column:1}
  .func-shot{grid-column:1;grid-row:2;height:230px;min-height:0}
  .func-body{grid-column:1;grid-row:3;padding-top:12px}
  .lb-panel{grid-template-columns:1fr;height:94vh}
  .lb-media{height:58vh;padding:18px 18px 34px}
  .lb-info{padding:22px 20px 20px}
}
</style>
</head>

<div class="wrap">
 <div class="mhead"><span class="kick">业务背景</span><h1>把一次就诊，变成持续的患者管理</h1>
 <p>肿瘤患者的治疗与康复跨越院内院外，信息分散、节点众多。全病程管理要解决的核心问题，是让患者离院之后，管理仍然持续、有人跟进、异常有人响应。</p></div>

 <section class="sec"><div class="sec-h"><h2>我们解决什么问题</h2><small>院内治疗延伸到医院之外</small></div>
 <div class="grid g4">
  <div class="card"><h3><span class="num">1</span>治疗周期长</h3><p>从治疗到复查、随访和康复支持，管理不是单次就诊即可完成。</p></div>
  <div class="card"><h3><span class="num">2</span>管理节点分散</h3><p>复查报告、随访问卷、症状反馈、营养评估等信息来源分散。</p></div>
  <div class="card green"><h3><span class="num">3</span>院外容易断点</h3><p>患者离院后是否按时完成任务、是否出现异常，需要持续追踪和响应。</p></div>
  <div class="card violet"><h3><span class="num">4</span>医护精力需要聚焦</h3><p>常规提醒、追踪和整理不应全部回到医生端，医生需要聚焦异常和关键判断。</p></div>
 </div>
 <div class="tint"><b>我们的做法：</b>院内治疗完成后，由个案管理师以任务驱动方式承接日常管理；患者按计划执行并反馈，系统沉淀数据、识别异常；医护只在关键节点介入专业判断。</div>
 </section>

 <section class="sec"><div class="sec-h"><h2>可以在什么场景使用</h2><small>覆盖住院、门诊与日间治疗</small></div>
 <div class="chips">
  <span class="chip"><b>住院</b> · 入院计划 / 入院评估</span>
  <span class="chip"><b>门诊</b> · 复查随访 / 报告上传</span>
  <span class="chip"><b>日间化疗</b> · 治疗提醒 / 不良反应上报</span>
  <span class="chip"><b>复查监测</b> · 指标预警</span>
  <span class="chip"><b>营养评估</b> · 体重与摄入跟踪</span>
  <span class="chip"><b>康复与患教</b> · 分阶段内容推送</span>
 </div>
 <div class="tint g">系统按治疗阶段配置管理计划，同一套平台可适配不同科室的管理方式；公共库提供多癌种、多场景的计划模板与患教内容，科室也可自行创建。</div>
 </section>

 <section class="sec"><div class="sec-h"><h2>服务协同模式</h2><small>医院 · 个案 · 患者 / 家属</small></div>
 <div class="collab">
  <div class="collab-row">
   <div class="cnode a"><div class="ci">${icoDoc}</div><h3>医院 / 医护</h3><div class="sub">医生、护士 · 专业判断</div>
    <p>查看患者情况，关注关键指标与异常；在关键节点给出专业判断和医疗干预。</p>
    <div class="tags"><span>查看患者情况</span><span>关注异常</span><span>专业判断</span></div></div>
   <div class="clink l"><i class="rev"></i><i class="dot"></i><i class="dot bk"></i>
    <span class="lb2"><b>专业判断 →</b><span class="bk">← 异常上报</span></span></div>
   <div class="cnode b mid"><div class="ci">${icoCase}</div><h3>个案</h3><div class="sub">个案管理师 · 日常枢纽</div>
    <p>承担高频管理工作：建档与计划、复查提醒、随访、患教、异常跟进与患者沟通。</p>
    <div class="tags"><span>建档与计划</span><span>日常跟进</span><span>复查提醒与随访</span><span>患教与沟通</span></div></div>
   <div class="clink r"><i class="rev"></i><i class="dot"></i><i class="dot bk"></i>
    <span class="lb2"><b>计划下发 · 提醒随访 →</b><span class="bk">← 执行反馈</span></span></div>
   <div class="cnode c"><div class="ci">${icoUser}</div><h3>患者 / 家属</h3><div class="sub">通过小程序参与</div>
    <p>清楚不同阶段要完成什么，离院后持续获得提醒、随访与专业支持，并主动反馈状态。</p>
    <div class="tags"><span>执行管理计划</span><span>完成复查随访</span><span>上传报告</span><span>反馈院外状态</span></div></div>
  </div>
  <div class="loopback"><i class="dot"></i><span>← 结果回写 · 计划更新，形成闭环</span></div>
  <div class="shared-core">三方共同围绕 <b>管理计划</b> · <b>任务</b> · <b>异常</b> · <b>反馈</b> 运转</div>
 </div>
 <div class="tint a"><b>协同的关键：</b>个案是连接患者执行与医护干预的日常枢纽；常规事务由工作台和计划驱动，医护时间集中在异常患者与关键判断上。</div>
 </section>

 <section class="sec"><div class="sec-h"><h2>全病程管理的业务全流程</h2><small>从入组到闭环 · 7 步</small></div>
 <div class="journey">
  <div class="jstep"><div class="jn">1</div><b>入组并建立服务关系</b><span>患者扫码加入，关联科室与医护团队</span></div>
  <div class="jstep"><div class="jn">2</div><b>建立患者档案</b><span>统一基础资料与病历信息</span></div>
  <div class="jstep"><div class="jn">3</div><b>制定管理计划</b><span>入院 / 复查 / 随访 / 营养按阶段配置</span></div>
  <div class="jstep"><div class="jn">4</div><b>生成待办并提醒</b><span>系统按时间推送至患者端</span></div>
  <div class="jstep"><div class="jn">5</div><b>患者执行并反馈</b><span>上传报告、填写问卷、确认用药</span></div>
  <div class="jstep"><div class="jn">6</div><b>个案持续跟进</b><span>处理逾期、异常与待办事项</span></div>
  <div class="jstep"><div class="jn">7</div><b>医护处理并更新计划</b><span>关键节点专业判断后闭环</span></div>
 </div>
 <div class="tint g"><b>一句话概括：</b>计划 → 提醒 → 执行 → 报告 → 异常 → 干预 → 回写；个案贯穿全程，医护聚焦关键判断，从「人盯人」转向「任务驱动」。</div>
 </section>
 <div class="pfoot">资料口径：极简版业务介绍 PPT（第 2–4、9 页）、《个案入科后业务开展与协作流程》。</div>
</div>`},

/* ============ 2 产品构成 ============ */
{name:'产品构成',sub:'患者端 · 医生端 · 个案端',html:`
<div class="wrap">
 <div class="mhead"><span class="kick">产品构成</span><h1>三端协同，个案平台居中</h1>
 <p>智能个案管理平台是业务中枢，患者端、医生端各司其职。三端围绕同一条管理计划运作，数据在同一条链路上流动。</p></div>

 <section class="sec"><div class="sec-h"><h2>三端关系</h2><small>点击查看下方真实界面</small></div>
 <div class="hub">
  <div class="end"><div class="em">${icoPhone}</div><b>患者端</b><small>海心健康小程序</small></div>
  <div class="hub-arrow">⇄</div>
  <div class="ct"><div class="c">智能个案<br>管理平台</div><span>业务中枢</span></div>
  <div class="hub-arrow">⇄</div>
  <div class="end g"><div class="em">${icoDoc}</div><b>医生端</b><small>海心医生 APP</small></div>
 </div>
 <div class="tint"><b>信息流向：</b>个案端生成并下发任务 → 患者端执行计划并上传反馈 → 个案端跟进任务上报异常 → 医生端处理需要专业判断的异常，结果回写计划，形成闭环。</div>
 </section>

 <section class="sec"><div class="sec-h"><h2>患者端 · 海心健康小程序</h2><small>患者及家属使用</small></div>
 <p class="card" style="font-size:13px;color:var(--ink2);padding:15px 20px">患者及家属通过小程序与医护团队沟通，查看并完成自己的治疗计划，上传的病历与报告会自动整理。加入方式：专属二维码扫码，或微信直接搜索（直接搜索无法关联科室）。</p>
 <div class="shots">
  ${img('pat_plan','治疗管理 · 复查报告与问卷')}
  ${img('pat_report','治疗任务 · 上传检查报告')}
  ${img('pat_edu','患教知识 · 视频详情页')}
  ${img('pat_in','入院计划 · 预约入院')}
  ${img('pat_notice','就诊提醒 · 上报不适症状')}
 </div>
 </section>

 <section class="sec"><div class="sec-h"><h2>医生端 · 海心医生 APP</h2><small>医护人员使用</small></div>
 <p class="card" style="font-size:13px;color:var(--ink2);padding:15px 20px">医护人员通过 APP 查看自己管理的患者并线上沟通；患者上传的报告或问卷出现异常时，可在 APP 内查看并处理。登录方式：手机号 + 验证码。</p>
 <div class="shots">
  ${img('doc_home','医生工作台 · 患者咨询 / 指标监测 / 随访预警')}
  ${img('doc_indicator','指标详情 · 异常预警与沟通处理')}
  ${img('doc_follow','随访预警 · 填写指导建议')}
 </div>
 </section>

 <section class="sec"><div class="sec-h"><h2>个案端 · 智能个案管理平台</h2><small>个案管理师使用 · 业务中枢</small></div>
 <p class="card" style="font-size:13px;color:var(--ink2);padding:15px 20px">按科室与治疗组管理患者，制定与导入计划、跟进任务与逾期、配置科室内容，并通过数据看板持续查看管理情况。</p>
 <div class="shots">
  ${img('case_work','工作台 · 治疗任务与日常任务')}
  ${img('case_data','数据看板 · 治疗组 / 科室汇报')}
  ${img('case_edu','配置患教内容')}
  ${img('case_quiz','选择随访问卷 / 量表')}
 </div>
 </section>
 <div class="pfoot">界面截图来自《极简版全病程管理业务介绍》与《详细版操作指南》，均已脱敏；实际界面以线上环境为准。</div>
</div>`},

/* ============ 3 协同流程 ============ */
{name:'协同流程',sub:'账号开通 · 患者入组 · 科室创建',html:`
<div class="wrap">
 <div class="mhead"><span class="kick">协同流程</span><h1>从开账号到建科室，三步把业务跑起来</h1>
 <p>正式业务与演示体验走同一套逻辑，差别在于账号来源与科室创建方式。以下按使用者最常问的三件事展开。</p></div>

 <section class="sec"><div class="sec-h"><h2>个案 / 医护账号开通</h2><small>三类账号</small></div>
 <div class="flow">
  <div class="frow"><div class="ft"><span class="num">A</span><b>个案管理师账号</b></div>
   <div class="steps">
    <div class="step"><span class="n">1</span><div><b>本人提交申请</b><span>各自申请各自账号，不代为申请；准备手机号、认证医院及科室、认证原因。</span></div></div>
    <div class="step"><span class="n">2</span><div><b>说明所属项目</b><span>一般为海心或 COC；账号创建平台不同需说明，不填写默认为海心。</span></div></div>
    <div class="step"><span class="n">3</span><div><b>开通后使用</b><span>用加入全病程管理服务的手机号登录个案平台，验证码登录。</span></div></div>
   </div></div>
  <div class="frow"><div class="ft"><span class="num g">B</span><b>医护人员账号</b></div>
   <div class="steps">
    <div class="step g"><span class="n">1</span><div><b>下载并注册</b><span>扫码下载海心医生 APP，或应用市场搜索；完成注册、实名认证与资质认证（填写医院信息、上传证件）。</span></div></div>
    <div class="step g"><span class="n">2</span><div><b>登录方式</b><span>手机号 + 验证码登录即可。</span></div></div>
    <div class="step g"><span class="n">3</span><div><b>开通在线咨询</b><span>医患咨询服务只能由医护本人 APP 开通，后台无权操作；开通后可自定义咨询时间。</span></div></div>
   </div></div>
  <div class="frow"><div class="ft"><span class="num v">C</span><b>体验账号</b></div>
   <div class="steps">
    <div class="step v"><span class="n">1</span><div><b>确认演示需求</b><span>与运营沟通演示需求，确认是否有可用演示科室、演示日期与演示者账号。</span></div></div>
    <div class="step v"><span class="n">2</span><div><b>账号入组</b><span>演示者账号（医生 / 患者）入组；可使用体验账号或个人账号登录。</span></div></div>
    <div class="step v"><span class="n">3</span><div><b>准备物料与手册</b><span>提供演示邀约物料、演示操作手册，按需创建测试患者并完善测试账号信息。</span></div></div>
   </div></div>
 </div>
 </section>

 <section class="sec"><div class="sec-h"><h2>患者账号开通</h2><small>扫码即可登录</small></div>
 <div class="grid g2">
  <div class="card"><h3><span class="num">1</span>扫码加入</h3><p>患者使用体验科室的专属二维码，直接扫码登录小程序，即可关联对应科室与医护团队。</p>
   <ul class="bullets"><li>扫码后完成账号创建与实名认证</li><li>正确关联科室，才能在患者端看到对应人员与计划</li></ul></div>
  <div class="card"><h3><span class="num">2</span>个案端协助建档</h3><p>也可由个案端创建患者账号，再由患者扫码绑定；病历信息可由患者端、个案端、医生端分别上传。</p>
   <div class="tint g">扫码只能核对患者端展示信息；职称与后台权限需另行确认。</div></div>
 </div>
 </section>

 <section class="sec"><div class="sec-h"><h2>科室 / 治疗组创建</h2><small>正式申请 · 体验加入</small></div>
 <div class="grid g2">
  <div class="card"><h3><span class="num">A</span>正式科室申请流程</h3>
   <ul class="bullets">
    <li>医生、护士先完成注册认证</li>
    <li>确认医院 / 科室 / 治疗组名称，避免重复申请</li>
    <li>准备个案信息、医护姓名及手机号、组长、科室管理员、是否参与患者管理</li>
    <li>提交科室申请 → 运营完成配置并提供物料</li>
    <li>个案扫码核对二维码与基础展示信息</li>
    <li>确认标准功能，按需提交自定义配置后正式开展服务</li>
   </ul></div>
  <div class="card green"><h3><span class="num">B</span>体验科室加入流程</h3>
   <ul class="bullets">
    <li>原则：每个部门 / 项目组使用一个演示科室</li>
    <li>从微盘【全病程管理业务】-《各部门体验科室》查看可用演示科室</li>
    <li>无可用演示科室时，由运营创建演示科室</li>
    <li>演示者账号入组（医生 & 患者），使用体验账号或个人账号</li>
    <li>完善个性化配置后即可开始产品体验与线下演示</li>
   </ul></div>
 </div>
 <div class="tint"><b>三个检查点：</b>申请前——医护是否完成注册认证；配置后——二维码与展示信息是否正确；使用前——必要的自定义配置是否完成。</div>
 </section>
 <div class="pfoot">资料口径：《个案入科后业务开展与协作流程》《海心医生注册及配置》《演示及产品体验流程》《全病程管理业务开展流程》。</div>
</div>`},

/* ============ 4 产品功能 ============ */
{name:'产品功能',sub:'患者管理功能 · 平台权限',html:`
<div class="wrap">
 <div class="mhead"><span class="kick">产品功能</span><h1>平台如何支撑日常患者管理</h1>
 <p>从大量人工记录、逐一追踪，转向基于工作台和计划的任务化管理。下面按「对患者做什么」和「谁能看到什么」两部分说明。</p></div>

 <section class="sec"><div class="sec-h"><h2>患者管理相关功能</h2><small>点击截图可放大查看</small></div>
 <div class="func-grid">
  <article class="func-card">
   <div class="func-head"><h3>复查监测</h3><span class="tag">计划驱动</span></div>
   <button class="func-shot" type="button" data-lb="0" aria-label="放大查看复查监测界面">
    <img src="${IMG.pat_plan}" alt="复查监测 · 治疗管理界面"><span class="zoom">点击放大</span></button>
   <div class="func-body"><p class="func-desc">制定复查计划并到期提醒患者；患者上传报告后系统沉淀数据，个案跟进逾期，异常进入医护处理。</p>
    <ul class="func-points"><li>计划驱动</li><li>到期提醒</li><li>报告沉淀</li><li>异常升级</li></ul></div>
  </article>
  <article class="func-card">
   <div class="func-head"><h3>患者随访</h3><span class="tag g">有周期 · 有内容</span></div>
   <button class="func-shot" type="button" data-lb="1" aria-label="放大查看患者随访界面">
    <img src="${IMG.doc_follow}" alt="患者随访 · 随访预警与指导建议"><span class="zoom">点击放大</span></button>
   <div class="func-body"><p class="func-desc">按治疗阶段配置随访周期，通过问卷 / 量表收集院外状态；未完成持续跟进，异常分层处理，必要时升级医护。</p>
    <ul class="func-points"><li>周期配置</li><li>问卷 / 量表</li><li>逾期跟进</li><li>分层处理</li></ul></div>
  </article>
  <article class="func-card">
   <div class="func-head"><h3>患教与自我管理</h3><span class="tag v">减少重复解释</span></div>
   <button class="func-shot" type="button" data-lb="2" aria-label="放大查看患教内容界面">
    <img src="${IMG.pat_edu}" alt="患教与自我管理 · 患教知识视频详情"><span class="zoom">点击放大</span></button>
   <div class="func-body"><p class="func-desc">根据疾病、治疗阶段与患者需求持续推送对应内容；公共库 1k+ 多癌种内容可直接使用，科室库支持自建。</p>
    <ul class="func-points"><li>阶段匹配</li><li>公共库 1k+</li><li>科室自建</li><li>减少重复解释</li></ul></div>
  </article>
  <article class="func-card">
   <div class="func-head"><h3>营养管理</h3><span class="tag">持续监测</span></div>
   <button class="func-shot" type="button" data-lb="3" aria-label="放大查看营养评估界面">
    <img src="${IMG.nut_eval}" alt="营养管理 · 营养评估与体重变化"><span class="zoom">点击放大</span></button>
   <div class="func-body"><p class="func-desc">通过营养评估与持续监测，跟踪体重、摄入等数据；出现异常时提示，并衔接后续干预。</p>
    <ul class="func-points"><li>营养评估</li><li>体重 / 摄入</li><li>异常提示</li><li>干预衔接</li></ul></div>
  </article>
  <article class="func-card">
   <div class="func-head"><h3>入院管理</h3><span class="tag g">住院 / 日间化疗</span></div>
   <button class="func-shot" type="button" data-lb="4" aria-label="放大查看入院计划界面">
    <img src="${IMG.pat_in}" alt="入院管理 · 入院计划与预约入院"><span class="zoom">点击放大</span></button>
   <div class="func-body"><p class="func-desc">提前记录计划入院时间，到期提醒并跟进状态，衔接院内治疗与院外管理周期。</p>
    <ul class="func-points"><li>入院计划</li><li>到期提醒</li><li>状态跟进</li><li>院内外衔接</li></ul></div>
  </article>
  <article class="func-card">
   <div class="func-head"><h3>患者病历</h3><span class="tag v">OCR 识别</span></div>
   <button class="func-shot" type="button" data-lb="5" aria-label="放大查看患者病历界面">
    <img src="${IMG.pat_report}" alt="患者病历 · 上传检查报告"><span class="zoom">点击放大</span></button>
   <div class="func-body"><p class="func-desc">患者可自主上传检查报告，系统识别关键信息，并以时间轴沉淀完整病历记录。</p>
    <ul class="func-points"><li>自主上传</li><li>OCR 识别</li><li>时间轴</li><li>完整记录</li></ul></div>

/* ---------- 渲染与切换 ---------- */
const nav=document.getElementById('nav'), main=document.getElementById('main');
let cur=0;
MODS.forEach((m,i)=>{
  const b=document.createElement('button');b.textContent=m.name;b.title=m.sub;
  b.onclick=()=>show(i);nav.appendChild(b);
  const s=document.createElement('section');s.className='mod';s.dataset.i=i;s.innerHTML=m.html;main.appendChild(s);
});
function show(i){
  cur=i;
  [...nav.children].forEach((b,k)=>b.classList.toggle('on',k===i));
  [...main.children].forEach((s,k)=>{s.classList.toggle('on',k===i);s.scrollTop=0});
  document.title='海心智惠 · '+MODS[i].name;
  history.replaceState(null,'','#'+i);
}
/* ---------- 功能截图放大 ---------- */
const lb=document.getElementById('lightbox');
const lbImg=document.getElementById('lbImg');
const lbCap=document.getElementById('lbCap');
const lbTitle=document.getElementById('lbTitle');
const lbDesc=document.getElementById('lbDesc');
const lbPoints=document.getElementById('lbPoints');
const lbClose=document.getElementById('lbClose');
const FUNCS=[...document.querySelectorAll('.func-card')].map(c=>{
  const im=c.querySelector('img');
  return {name:c.querySelector('h3').textContent.trim(),img:im.src,cap:im.alt,
    desc:c.querySelector('.func-desc').innerHTML,
    points:[...c.querySelectorAll('.func-points li')].map(x=>x.textContent.trim())};
});
let lbIdx=0;
function openLb(i){
  if(!FUNCS.length)return;
  lbIdx=(i+FUNCS.length)%FUNCS.length;
  const f=FUNCS[lbIdx];
  lbImg.src=f.img;lbImg.alt=f.cap;lbCap.textContent=f.cap;
  lbTitle.textContent=f.name;
  lbDesc.innerHTML=f.desc;
  lbPoints.innerHTML=f.points.map(p=>'<li>'+p+'</li>').join('');
  lb.classList.add('show');lb.setAttribute('aria-hidden','false');
  lbClose.focus({preventScroll:true});
}
function closeLb(){
  lb.classList.remove('show');lb.setAttribute('aria-hidden','true');
}
document.querySelectorAll('.func-shot').forEach(b=>b.addEventListener('click',()=>openLb(+b.dataset.lb)));
lbClose.addEventListener('click',closeLb);
lb.addEventListener('click',e=>{if(e.target===lb)closeLb()});
document.getElementById('lbPrev').addEventListener('click',()=>openLb(lbIdx-1));
document.getElementById('lbNext').addEventListener('click',()=>openLb(lbIdx+1));
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('show'))return;
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowLeft')openLb(lbIdx-1);
  if(e.key==='ArrowRight')openLb(lbIdx+1);
});
document.getElementById('exportBtn').onclick=()=>{
  const b=document.getElementById('exportBtn');
  b.disabled=true;const old=b.innerHTML;
  b.innerHTML='正在准备 PDF…';
  setTimeout(()=>{window.print();b.disabled=false;b.innerHTML=old},80);
};
window.addEventListener('beforeprint',()=>{
  document.title='海心智惠 · '+MODS[cur].name;
});
const h=location.hash.match(/^#(\d)$/);
show(h?Math.min(+h[1],MODS.length-1):0);
</script>
</body>
</html>
